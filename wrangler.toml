name = "mooncode-study"
main = "workers/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Free compatible static assets configuration:
# Static assets are served directly without invoking Worker CPU;
# ONLY /api/* passes through the Worker for auth & GitHub sync.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
GITHUB_DATA_BRANCH = "main"
